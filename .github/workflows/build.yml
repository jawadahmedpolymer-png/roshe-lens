name: Build Roshe Lens
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Create Xcode project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project RosheLens.xcodeproj -scheme RosheLens \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package RosheLens.ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RosheLens.app Payload/
          zip -qry RosheLens.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RosheLens-ipa
          path: RosheLens.ipa
